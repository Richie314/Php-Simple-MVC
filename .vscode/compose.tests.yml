name: simple-mvc-tests

# Tests run from image copies, leaving host dependencies and files untouched.
services:
  php83:
    build:
      context: ../
      dockerfile: tests/Dockerfile
      args:
        PHP_VERSION: '8.3'
  php84:
    build:
      context: ../
      dockerfile: tests/Dockerfile
      args:
        PHP_VERSION: '8.4'
  php85:
    build:
      context: ../
      dockerfile: tests/Dockerfile
      args:
        PHP_VERSION: '8.5'
