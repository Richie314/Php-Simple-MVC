name: Tests (Docker)

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the PHP test image
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: docker build --build-arg "PHP_VERSION=$PHP_VERSION" --file tests/Dockerfile --tag simple-mvc-tests .

      - name: Run Composer, syntax, and regression checks in Docker
        run: docker run --rm simple-mvc-tests

